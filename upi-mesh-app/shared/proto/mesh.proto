syntax = "proto3";

package upimesh.v1;

option go_package = "github.com/upi-mesh-app/shared/gen/go/upimesh/v1;upimeshv1";

message MeshEvent {
  string event_type = 1;
  string packet_id = 2;
  string from_device = 3;
  string to_device = 4;
  string device_id = 5;
  uint32 ttl = 6;
  string result = 7;
  int64 timestamp_ms = 8;
}

message MeshDevice {
  string id = 1;
  string name = 2;
  bool has_internet = 3;
  bool is_current_device = 4;
  uint32 packet_count = 5;
  int64 last_seen = 6;
  int32 rssi = 7;
  bool is_killed = 8;
}

message MeshState {
  repeated MeshDevice devices = 1;
  uint32 idempotency_cache_size = 2;
}

message GossipRequest {}

message GossipResponse {
  uint32 transfers = 1;
  map<string, uint32> device_counts = 2;
}

message FlushRequest {}

message FlushResponse {
  uint32 uploads_attempted = 1;
  repeated BridgeUploadResult results = 2;
}

message BridgeUploadResult {
  string bridge_node = 1;
  string packet_id = 2;
  string outcome = 3;
  string reason = 4;
  int64 transaction_id = 5;
}